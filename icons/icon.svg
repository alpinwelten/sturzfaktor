<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sturzfaktor">
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#006064"/>
      <stop offset="55%" stop-color="#2F8A8E"/>
      <stop offset="100%" stop-color="#3E969A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>

  <!-- Sturz: Pfeil nach unten (freie Fallstrecke) -->
  <path d="M256 150 V300" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <path d="M208 296 H304 L256 374 Z" fill="#FFFFFF"/>

  <!-- Fangstoß: Aufprall-Linie + Funken, sand-300 -->
  <path d="M150 412 H362" stroke="#DBAE8D" stroke-width="30" stroke-linecap="round"/>
  <path d="M256 404 L232 380 M256 404 L280 380 M256 402 V378"
        stroke="#DBAE8D" stroke-width="10" stroke-linecap="round"/>
</svg>
